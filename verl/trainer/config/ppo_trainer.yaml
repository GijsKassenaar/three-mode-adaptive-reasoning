# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# specify the default per-component configs
defaults:

  # <folder_name>@<field_name>.<field_name>: <yaml_file_name>
  # actor_rollout_ref.actor: trainer/config/actor/dp_actor.yaml
  - actor@actor_rollout_ref.actor: dp_actor

  # data: trainer/config/data/legacy_data.yaml
  - data@data: legacy_data

  # (Rule-based) Reward manager config.
  - reward_manager@reward_manager

  # Reference model config.
  # Reference model will be enabled when actor.use_kl_loss or/and algorithm.use_kl_in_reward is/are True.
  - ref@actor_rollout_ref.ref: dp_ref

  # Rollout model config.
  - rollout@actor_rollout_ref.rollout: rollout

  # Model config.
  - model@actor_rollout_ref.model: hf_model

  # Critic model config.
  - critic@critic: dp_critic

  # Reward model config.
  - reward_model@reward_model: dp_reward_loop

  # Rollout correction config.
  - algorithm@algorithm.rollout_correction: rollout_correction

  # load the reference default config, then apply the fields in the current yaml
  # self config override anything above
  - _self_

# config for actor, rollout and reference model
actor_rollout_ref:

  # Whether it's a hybrid engine, currently only supports hybrid engine
  hybrid_engine: true

  # Timeout for operations executed against the process group
  nccl_timeout: 600

  # Rollout model config.
  rollout:

    # for huge model, layered summon can save memory (prevent OOM) but make it slower
    layered_summon: False

# custom reward function definition
custom_reward_function:

  # The path to the file containing your customized reward function.
  # If not specified, pre-implemented reward functions will be used.
  path: null

  # The name of the reward function within the specified file. Default is 'compute_score'.
  name: compute_score

# config for the algorithm
algorithm:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.trainer.config.AlgoConfig

  # Discount factor for future rewards
  gamma: 1.0

  # Trade-off between bias and variance in the GAE estimator
  lam: 1.0

  # Advantage estimator type: "gae", "grpo", "reinforce_plus_plus", etc.
  adv_estimator: gae

  # Whether to normalize advantages by std (specific to GRPO)
  norm_adv_by_std_in_grpo: True

  # Whether to enable in-reward KL penalty
  use_kl_in_reward: False

  # How to estimate KL divergence: "kl", "abs", "mse", "low_var_kl", or "full"
  kl_penalty: kl

  # KL control configuration
  kl_ctrl:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.trainer.config.KLControlConfig

    # KL control type: "fixed" or "adaptive"
    type: fixed

    # Initial coefficient for KL penalty
    kl_coef: 0.001

    # Horizon value for adaptive controller (if enabled)
    horizon: 10000

    # Target KL divergence (used for adaptive controller)
    target_kl: 0.1

  # Whether to enable preference feedback PPO
  use_pf_ppo: False

  # Preference feedback PPO settings
  pf_ppo:

    # Method for reweighting samples: "pow", "max_min", or "max_random"
    reweight_method: pow

    # Power used for weight scaling in "pow" method
    weight_pow: 2.0

  # Adaptive three-mode self-routing GRPO (NOTHINK / SHORT / LONG).
  # The model emits one routing word as its first response token; routing is learned
  # through a shaped reward surface + per-mode hard token caps (no auxiliary loss).
  # Implementation: verl/trainer/ppo/three_mode_routing.py
  three_mode_routing:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.trainer.config.ThreeModeRoutingConfig

    # Master switch (also set algorithm.adv_estimator=three_mode_routing).
    enable: False

    # Routing words the model emits as its first response token.
    nothink_token: "NOTHINK"
    short_token: "SHORT"
    long_token: "LONG"

    # Injected into the last user message before generation (runtime, no new parquet needed).
    routing_question: "\n\nOutput NOTHINK to answer directly, SHORT for brief reasoning, or LONG for extended reasoning: "

    # Reward bases for correct answers.
    nothink_base: 2.0
    short_base: 1.5
    long_base: 1.0

    # Per-token exponential discount (gamma^L).
    # reward_correct = base * gamma^L where L = tokens after the routing token.
    # Set crossovers at your token caps:
    #   gamma_short   = (long_base / short_base)^(1/short_cap)
    #   gamma_nothink = gamma_short * (short_base / nothink_base)^(1/nothink_cap)
    # NOTE: these defaults follow the recipe for bases 1.4/1.3/1.0 with caps 1024/3000,
    # NOT the default bases above (2.0/1.5/1.0).  Always set gammas together with bases.
    # Keep gammas <= 1.0: a value > 1 rewards longer responses AND overflows base*gamma^L.
    gamma_nothink: 0.99984
    gamma_short: 0.999912
    # Discount for LONG (1.0 = no discount, the original design).  <1 adds gentle
    # length pressure within LONG as well.
    gamma_long: 1.0

    # When True, L (used for gamma^L above) is computed only from tokens before the
    # first closing </think> tag instead of the full response length.  Requires a
    # tokenizer.  Responses that never close </think> get L=0 (no discount).
    reasoning_only: False

    # Reward override when no valid routing word is emitted.
    unknown_penalty: -0.5

    # Reward for incorrect answers, per mode (default 0.0 = no penalty).
    # Set nothink_wrong_penalty < 0 to create a risk-reward tradeoff:
    # choosing an aggressive mode but getting it wrong costs more than falling back to LONG.
    nothink_wrong_penalty: 0.0
    short_wrong_penalty: 0.0
    long_wrong_penalty: 0.0

    # Rollout protocol:
    #   phase 1 (0..warmup_steps):          n//4 forced per mode + remainder free
    #   phase 2 (warmup_steps..warmup2_steps, if >warmup_steps): 1 forced per mode + remainder free
    #   phase 3 (post-warmup2):             all n free
    warmup_steps: 100
    warmup2_steps: 0   # 0 = disabled; set > warmup_steps to enable phase 2
    n_rollouts: 4      # total group size G

    # Per-mode hard response caps (tokens).  Applied post-rollout before reward so a
    # response that exceeds its mode's cap is scored wrong — mechanically separating
    # modes so the router can learn from real correctness differences.  null = no cap.
    nothink_max_tokens: null
    short_max_tokens: null
    long_max_tokens: null

    # Balance term (advantage level): pushes the three-way mode split toward balance_target.
    # Applied after group mean-centering in solved groups (or all groups post-gate warmup).
    balance_coef: 0.5
    balance_target: 0.3333  # ~1/3

    # Linear annealing of balance_coef (0/0 = disabled, coef stays constant).
    # Full balance_coef up to start_step, linearly interpolated to final_coef at
    # end_step, constant final_coef afterwards.  Anneal to 0 after routing is
    # established (e.g. start=45, end=75) to test whether the split is genuinely
    # difficulty-calibrated rather than held at the target by the balance term.
    # Logged as three_mode_routing/balance_coef_effective.
    balance_anneal_start_step: 0
    balance_anneal_end_step: 0
    balance_anneal_final_coef: 0.0

    # Gate the balance nudge by correctness: positive (encourage) nudges apply only to
    # CORRECT rollouts, negative (discourage) nudges only to WRONG ones — so a correct
    # answer in a popular mode is never pushed down. False = symmetric nudge.
    balance_correctness_gated: False

    # When True, LONG rollouts with an incorrect answer never receive a balance nudge, so the
    # load-balancer never pushes the hardest (often-wrong) problems away from LONG. False = off.
    balance_protect_long_incorrect: False

    # Solved-group gate: for global_steps <= solved_gate_warmup_steps, gate the unknown_penalty
    # and balance term on groups with >=1 correct answer only (anti-gaming bootstrap).
    # After warmup ALL groups are shaped.  0 = gate never active.
    solved_gate_warmup_steps: 0

    # Forced mode for val_only evaluation runs.  "" = free (model chooses its own token).
    # "nothink" / "short" / "long" = inject routing question + token into prompt so the
    # model is forced into that mode.  Use with trainer.val_only=True to compare per-mode
    # accuracy and length without stochastic routing noise.
    val_forced_mode: ""

    # Forced mode for TRAINING rollouts (ablation: fully-forced single-mode training).
    # "" = normal phased forcing (n//4 forced per mode + free, per warmup_steps/warmup2_steps).
    # "nothink" / "short" / "long" = every rollout, every step, forced into that one mode
    # (no free/self-routing behaviour at all, for the whole run). Overrides enabled_modes
    # for the forced loop. Use with trainer.val_only=False.
    train_forced_mode: ""

    # ── Detection / normalization behaviour flags.  Defaults are the recommended
    # settings; each can be flipped to reproduce earlier behaviour. ──────────────

    # True uses \b-bounded regex detection.  False (default) matches token ids /
    # prefixes, so "LONGI need…" is not misclassified as unknown (a \b regex drops
    # a large fraction of valid routing words with attached continuations).
    strict_token_boundary: False

    # True (default): balance-term fractions and nudges cover FREE rollouts only.
    # False computes fractions over all rollouts (diluted toward the target by the
    # forced rollouts during warmup, masking free-policy collapse).
    balance_free_only: True

    # True (default): unknown rollouts are excluded from the group mean, so a large
    # unknown_penalty cannot give incorrect-but-valid groupmates positive advantage.
    # False keeps the all-rollout mean.
    exclude_unknown_from_mean: True

    # Step from which exclude_unknown_from_mean takes effect (0 = immediately).
    # The unknowns' drag on the group mean is what gives ALL forced routing tokens a
    # positive advantage during warmup — the engine that bootstraps routing-word
    # emission.  Excluding from step 1 can freeze the policy at unknown_fraction=1.0.
    # Set past the forcing warmup (e.g. 30) when using large unknown penalties.
    exclude_unknown_from_mean_start_step: 0

    # True: per-mode caps are also applied before scoring at validation, matching
    # the trained objective (diagnostic).  Default False: validation measures
    # production behaviour (free generation, no truncation harness); a mode can
    # then score slightly better at val than under the trained capped objective.
    apply_caps_in_validation: False

    # ── Two-pass free rollout generation (efficiency) ─────────────────────────────
    # Pass 1 generates router_pass_tokens tokens to read the routing word; pass 2
    # continues each rollout with exactly its mode's remaining budget
    # (mode_cap - router_pass_tokens).  Caps become real generation stops instead of
    # post-hoc truncation (no wasted tokens past a binding cap).  With
    # unknown_early_stop, unknown-routed rollouts skip pass 2 entirely — their reward
    # is a constant penalty regardless of content, so the continuation is pure waste
    # and the penalty gradient concentrates on the routing decision itself.
    # False = single-pass generation.
    two_pass_enable: False
    router_pass_tokens: 8
    unknown_early_stop: True
    two_pass_debug: False   # print stitched rollout samples each step
    two_pass_debug_n: 4     # number of samples to print per step

    # Active routing modes (comma string, subset of nothink,short,long). Default all
    # three. Set "nothink,long" for a 2-mode router; disabled modes aren't forced and a
    # free rollout emitting one scores as unknown. Set balance_target=1/n_modes.
    enabled_modes: "nothink,short,long"

# Rollout-time behaviour toggles (read by the agent loop)
agent:

  # Force `</think>\n\n` immediately after the generation prompt, so the model
  # answers directly without any chain-of-thought reasoning.  Used to measure
  # the 'no-thinking' accuracy baseline (see scripts/eval_nothink_baseline.job).
  nothink: false

# config for the trainer
trainer:

  # Whether to balance batch sizes across distributed workers
  balance_batch: True

  # Number of epochs in training
  total_epochs: 30

  # Total training steps (can be set explicitly or derived from epochs)
  total_training_steps: null

  # Project name for experiment tracking (e.g., wandb)
  project_name: verl_examples

  # Experiment name for run identification in tracking tools
  experiment_name: gsm8k

  # Logging backends to use: "console", "wandb", etc.
  logger: ["console", "wandb"]

  # Number of generations to log during validation
  log_val_generations: 0

  # Directory for logging rollout data; no dump if null
  rollout_data_dir: null

  # Directory for logging validation data; no dump if null
  validation_data_dir: null

  # Number of nodes used in the training
  nnodes: 1

  # Number of GPUs per node
  n_gpus_per_node: 8

  # Save frequency (by iteration) for model checkpoints
  save_freq: -1

  # ESI refers to the elastic server instance used during training, similar to the training plan. For example,
  # if you purchase 10 hours of computing power, the ESI will automatically shut down after 10 hours of training.
  # To ensure a checkpoint is saved before ESI shuts down, the system will start saving a checkpoint in advance.
  # The advance time is calculated as: Advance Time = Longest historical step duration + Checkpoint save duration + esi_redundant_time.
  # Here, esi_redundant_time is a user-defined value that further extends the advance time for added safety.
  esi_redundant_time: 0

  # Resume mode: "auto", "disable", or "resume_path"
  # "auto": resume from last checkpoint if available
  # "disable": start from scratch
  # "resume_path": resume from a user-defined path
  resume_mode: auto

  # Path to resume training from (only used when resume_mode is "resume_path")
  resume_from_path: null

  # Whether to run validation before training begins
  val_before_train: True

  # Whether to run validation only
  val_only: False

  # Validation frequency (in training iterations)
  test_freq: -1

  # Number of iterations to warm up the critic before updating policy
  critic_warmup: 0

  # Default path to distributed filesystem for saving checkpoints
  default_hdfs_dir: null

  # Whether to delete local checkpoints after loading
  del_local_ckpt_after_load: False

  # Default local directory for saving checkpoints
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

  # Maximum number of actor checkpoints to keep
  max_actor_ckpt_to_keep: null

  # Maximum number of critic checkpoints to keep
  max_critic_ckpt_to_keep: null

  # Timeout (in seconds) for Ray worker to wait for registration
  ray_wait_register_center_timeout: 300

  # Device to run training on (e.g., "cuda", "cpu")
  device: cuda

  # whether to use legacy worker implementation
  #  mode: "auto", "enable", or "disable"
  use_legacy_worker_impl: auto

# profiler configs
global_profiler:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.utils.profiler.ProfilerConfig

  # Profiling tool: choose between nsys, npu, torch, torch_memory
  tool: null

  # profile steps
  steps: null

  # Whether to combine continuous steps into one database.
  ## If True, worker.profiler.discrete must be False, [1,2] in one, [5] in another.
  ## If False, [1] in one, [2] in another, [5] in another.
  profile_continuous_steps: False

  # Path to save profiling contents
  save_path: "outputs/profile"

  # Specific tool configs, can use +profiler.tool_config.[tool].xxx to config
  global_tool_config:

    # nsys config
    nsys:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NsightToolConfig

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: False

      # controller Nvidia Nsight Systems Options. Must set when profile_steps is not None.
      ## reference https://docs.nvidia.com/nsight-systems/UserGuide/index.html
      ## reference https://docs.ray.io/en/latest/ray-observability/user-guides/profiling.html
      controller_nsight_options:

        # Select the API(s) to be traced.
        trace: "cuda,nvtx,cublas,ucx"

        # Track the GPU memory usage by CUDA kernels. Must be string type "true" or "false".
        cuda-memory-usage: "true"

        # CUDA graphs will be traced as a whole
        cuda-graph-trace: "graph"

      # worker Nvidia Nsight Systems Options. Must set when profile_steps is not None.
      worker_nsight_options:

        # Select the API(s) to be traced.
        trace: "cuda,nvtx,cublas,ucx"

        # Track the GPU memory usage by CUDA kernels. Must be string type "true" or "false".
        cuda-memory-usage: "true"

        # CUDA graphs will be traced as a whole
        cuda-graph-trace: "graph"

        # Profiling only in a range of torch.cuda.profiler.start and stop. Do not change this config.
        capture-range: "cudaProfilerApi"

        # Specify the desired behavior when a capture range ends.
        # In verl we need the torch.cuda.profiler.start/stop pair to repeats n times.
        # valid values are "repeat-shutdown:n" or null.
        # For normal whole step profiling, n = len(profile_steps);
        # but for discrete profiling, n = len(profile_steps) * Number(subtasks).
        # Or you can just leave it null and the program will use n = len(profile_steps) * 6;
        capture-range-end: null

        # Send signal to the target application's process group. We let the program to exit by itself.
        kill: none

    # enable memory visualization for debugging memory usage
    torch_memory:

      #  Maximum number of allocation entries to record
      trace_alloc_max_entries: 100_000

      # The depth of the call stack to capture for each allocation
      stack_depth: 32

      # 'alloc': records only allocation events || 'state': records memory state changes || 'all': records both.
      context: "all"

      # 'python': records Python stacks || 'cpp': records C++ stacks (available in some versions) || 'all': records both.
      stacks: "all"

      # devices, record_context etc.
      kw_args: {}

# configs for TransferQueue
transfer_queue:

  # Whether to enable transfer queue
  enable: False

# configs related to ray
ray_kwargs:

  # configs related to ray initialization
  ray_init:

    # Number of CPUs for Ray. Use a fixed number instead of null when using SLURM.
    num_cpus: null

  # Path to save Ray timeline JSON for performance profiling
  timeline_json_file: null
