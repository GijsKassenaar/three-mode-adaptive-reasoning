name: cpu-tests

# Runs the CPU-only unit tests on standard GitHub-hosted runners.
#
# Upstream verl's own CI (self-hosted GPU runners, private docker registries,
# volcengine-internal infrastructure) does not travel with this repo and was
# removed — see CHANGES_VS_VERL.md. This workflow covers what can actually run
# here: the three-mode-routing reward/advantage/detection/caps logic, which is
# pure CPU tensor math with no GPU or model dependency.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: pip install torch numpy pytest pytest-asyncio omegaconf tensordict ray packaging transformers

      - name: Run three-mode-routing CPU unit tests
        run: pytest -q tests/trainer/ppo/test_three_mode_routing_on_cpu.py
